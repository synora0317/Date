/* Layout: one-column phone app — who's picking, tabs, chip filter, card grid, matches tray at bottom */
:root{
  --bg:#f6f3f8; --surface:#ffffff; --ink:#2b2236; --muted:#7a6f86; --line:#e4dcea;
  --me:#1f9e8f; --me-soft:#d9f2ee; --her:#e2577d; --her-soft:#fbe1e8; --both:#7a4fd6; --both-soft:#ece4fb;
  --display:"Jua","JuaFix","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17131c; --surface:#221c29; --ink:#f1ebf6; --muted:#a79bb3; --line:#352c3e;
  --me:#3cc4b3; --me-soft:#16352f; --her:#f07a9b; --her-soft:#3e1f2a; --both:#a787f0; --both-soft:#2c2342; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17131c; --surface:#221c29; --ink:#f1ebf6; --muted:#a79bb3; --line:#352c3e;
  --me:#3cc4b3; --me-soft:#16352f; --her:#f07a9b; --her-soft:#3e1f2a; --both:#a787f0; --both-soft:#2c2342; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 140px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:400;font-size:30px;margin:0;line-height:1.15;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--both);outline-offset:2px}

.who{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.who button{border:0;background:transparent;border-radius:10px;padding:10px;font-family:var(--display);font-size:17px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.who button .dot{width:10px;height:10px;border-radius:50%}
.who button[data-p="me"] .dot{background:var(--me)}
.who button[data-p="her"] .dot{background:var(--her)}
.who button.on[data-p="me"]{background:var(--me-soft);color:var(--ink)}
.who button.on[data-p="her"]{background:var(--her-soft);color:var(--ink)}
.hint{font-size:13px;color:var(--muted);margin:-8px 2px 0}

.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:6px 0 10px;font-family:var(--display);font-size:20px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.tabs .n{font-family:var(--body);font-size:12px;color:var(--both);margin-left:4px}

.chips{display:flex;flex-direction:column;gap:8px}
.crow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.clab{font-family:var(--display);font-size:15px;color:var(--muted);margin-right:4px}
.crow button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.crow button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{position:relative;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0;transition:border-color .15s,transform .1s}
.card:active{transform:scale(.97)}
.card .name{font-family:var(--display);font-size:18px;line-height:1.25}
.card .cat{font-size:12px;color:var(--muted)}
.card .marks{position:absolute;top:10px;right:10px;display:flex;gap:4px}
.card .marks i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line);display:block}
.card.me .marks i.m{background:var(--me);border-color:var(--me)}
.card.her .marks i.h{background:var(--her);border-color:var(--her)}
.card.me{border-color:var(--me)}
.card.her{border-color:var(--her)}
.card.me.her{border-color:var(--both);background:var(--both-soft)}
.card.me.her .cat::after{content:" · 둘 다 좋대!";color:var(--both);font-weight:700}
.card.x .del{position:absolute;bottom:8px;right:10px;font-size:12px;color:var(--muted);border:0;background:none;padding:2px}

.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.add button{border:0;border-radius:12px;padding:0 16px;background:var(--ink);color:var(--bg);font-family:var(--display);font-size:16px}

.tray{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.tray .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.tray .txt{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.tray .txt b{display:block;font-family:var(--display);font-weight:400;font-size:17px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cta{border:0;border-radius:12px;padding:12px 16px;background:var(--both);color:#fff;font-family:var(--display);font-size:16px;white-space:nowrap}
.cta:disabled{opacity:.4;cursor:default}

.sheet{position:fixed;inset:0;background:rgba(20,12,28,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.panel{background:var(--bg);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.panel h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0}
.panel h3{font-size:13px;color:var(--muted);margin:0;font-weight:400;letter-spacing:.04em}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;font-family:var(--display);font-size:16px}
.pick button.both{border-color:var(--both)}
.pick button.on{background:var(--both);color:#fff;border-color:var(--both)}
.pick .none{font-size:13px;color:var(--muted)}
.ticket{background:var(--surface);border:1.5px dashed var(--both);border-radius:16px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline}
.ticket .k{font-size:13px;color:var(--muted)}
.ticket .v{font-family:var(--display);font-size:22px}
.row{display:flex;gap:8px}
.row button{flex:1}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-family:var(--display);font-size:16px}
.rand{display:flex;flex-direction:column;gap:10px}
.rbtn{border:1.5px dashed var(--both);background:transparent;color:var(--both);border-radius:12px;padding:11px;font-family:var(--display);font-size:16px}
.rres{background:var(--both-soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.rq{font-family:var(--display);font-size:20px}
.rq b{font-weight:400;color:var(--both);font-size:26px}
.rrow{display:flex;gap:8px;flex-wrap:wrap}
.rrow .ghost{padding:12px 16px}
.rres.spin .rq b{opacity:.5}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.sync.on i{background:var(--me)}
.sync.wait i{background:var(--her)}
.sync button{border:0;background:none;padding:0;color:var(--muted);font-size:12px;text-decoration:underline;margin-left:4px}
.codebox{display:flex;flex-direction:column;gap:12px}
.codebox p{margin:0;color:var(--muted);font-size:14px}
.codebox input{font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.rolepick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rolepick button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-family:var(--display);font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.rolepick button .dot{width:10px;height:10px;border-radius:50%}
.rolepick button[data-r="me"] .dot{background:var(--me)}
.rolepick button[data-r="her"] .dot{background:var(--her)}
.rolepick button.on[data-r="me"]{border-color:var(--me);background:var(--me-soft)}
.rolepick button.on[data-r="her"]{border-color:var(--her);background:var(--her-soft)}
.codebox h3{font-size:14px;color:var(--ink);margin:4px 0 0;font-weight:700}
.codebox .err{color:var(--her);font-size:13px;min-height:1em}
.reset{align-self:flex-start;border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>오늘 데이트, 뭐 할까?</h1>
    <p class="sub">끌리는 거 골라봐!</p>
    <p class="sync" id="sync" hidden><i></i><span id="syncTxt"></span><button id="codeChange" type="button" hidden>설정 바꾸기</button></p>
  </header>

  <div class="who" role="tablist" aria-label="고르는 사람">
    <button id="p-me" data-p="me"><span class="dot"></span><span id="nm-me">나</span></button>
    <button id="p-her" data-p="her"><span class="dot"></span><span id="nm-her">여자친구</span></button>
  </div>
  <p class="hint" id="hint"></p>

  <nav class="tabs">
    <button id="t-play" data-t="play">놀거리<span class="n" id="n-play"></span></button>
    <button id="t-food" data-t="food">먹을거<span class="n" id="n-food"></span></button>
  </nav>

  <div class="chips" id="chips"></div>
  <div class="rand">
    <button id="randBtn" class="rbtn">끌리는 게 없어? 랜덤으로 골라줘</button>
    <div class="rres" id="rres" hidden>
      <span class="rq" id="rq"></span>
      <div class="rrow"><button id="rOk" class="cta">이걸로 하자</button><button id="rAgain" class="ghost">다시 돌려</button></div>
    </div>
  </div>
  <div class="grid" id="grid"></div>

  <form class="add" id="addForm">
    <input id="addInput" placeholder="먹고 싶은 거, 하고 싶은 거 추가하기" maxlength="20" autocomplete="off">
    <button type="submit">추가</button>
  </form>
  <button class="reset" id="reset">선택 모두 지우기</button>
</div>

<div class="tray"><div class="in">
  <div class="txt" id="trayTxt"></div>
  <button class="cta" id="decide">이걸로 정하자</button>
</div></div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-label="데이트 결정">
    <h2>둘 다 고른 것 중에 골라!</h2>
    <h3>놀거리</h3><div class="pick" id="pk-play"></div>
    <h3>먹을거</h3><div class="pick" id="pk-food"></div>
    <div class="ticket" id="ticket"></div>
    <div class="row"><button class="ghost" id="close">다시 고를래</button></div>
  </div>
</div>

<div class="sheet" id="codeSheet" hidden>
  <form class="panel codebox" id="codeForm" role="dialog" aria-label="커플 코드">
    <h2>커플 연결하기</h2>
    <p>둘이 똑같은 코드를 넣어야 서로 연결돼. 둘만 아는 걸로 정해줘! 처음 한 번만 넣으면 돼.</p>
    <input id="codeInput" placeholder="예: 0412우리둘" autocomplete="off" maxlength="60" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false">
    <h3>이 폰은 누구 거야?</h3>
    <div class="rolepick" id="rolePick">
      <button type="button" data-r="me"><span class="dot"></span>나</button>
      <button type="button" data-r="her"><span class="dot"></span>여자친구</button>
    </div>
    <span class="err" id="codeErr"></span>
    <div class="row"><button class="cta" type="submit">연결하기</button><button class="ghost" type="button" id="codeLater">나중에</button></div>
  </form>
</div>

function visible(i){
  if(S.tab==="play")return S.cat==="전체"||i.c===S.cat;
  if(S.ftype!=="전체"&&i.ty!==S.ftype)return false;
  if(S.ftype!=="전체"&&S.ftype!=="추가함"&&S.fcui!=="전체"&&i.c!==S.fcui)return false;
  return true;
}
const k=(t,n)=>t+"|"+n;
const sel=(t,n)=>S.sel[k(t,n)]||{};
const matches=t=>items(t).filter(i=>{const s=sel(t,i.n);return s.me&&s.her}).map(i=>i.n);

function render(){
  document.querySelectorAll(".who button").forEach(b=>b.classList.toggle("on",b.dataset.p===S.who));
  $("hint").textContent=ROOT
    ?(S.who==="me"?"초록은 나, 분홍은 너, 보라는 둘 다!":"분홍은 나, 초록은 너, 보라는 둘 다!")
    :(S.who==="me"?"내 차례!":"너 차례! 끌리는 거 다 눌러도 돼~");
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===S.tab));
  ["play","food"].forEach(t=>{const m=matches(t).length;$("n-"+t).textContent=m?"♥"+m:""});
  const extra=S.custom[S.tab].length?["추가함"]:[];
  if(S.tab==="play"){
    const cats=["전체",...BASE.play.cats,...extra];
    if(!cats.includes(S.cat))S.cat="전체";
    $("chips").innerHTML=chipRow("",cats,S.cat,"c");
  }else{
    const types=["전체",...BASE.food.types,...extra];
    if(!types.includes(S.ftype))S.ftype="전체";
    let h=chipRow("뭐 먹지?",types,S.ftype,"ft");
    if(S.ftype!=="전체"&&S.ftype!=="추가함"){
      const cuis=["전체",...BASE.food.cats.filter(c=>BASE.food.items.some(i=>i[2]===S.ftype&&i[1]===c))];
      if(!cuis.includes(S.fcui))S.fcui="전체";
      h+=chipRow("어느 쪽?",cuis,S.fcui,"fc");
    }
    $("chips").innerHTML=h;
  }
  const list=items(S.tab).filter(visible);
  $("grid").innerHTML=list.map(i=>{
    const s=sel(S.tab,i.n);
    return `<button class="card${s.me?" me":""}${s.her?" her":""}${i.x?" x":""}" data-n="${i.n.replace(/"/g,"&quot;")}" aria-pressed="${!!s[S.who]}">

    ?`둘 다 고른 것<b>${esc([...mp,...mf].join(", "))}</b>`

  $("decide").disabled=!(mp.length||mf.length);
  save();
}

const OLD_CODE_KEY="date-menu-code",ROOM_KEY="date-menu-room",ROLE_KEY="date-menu-role";
try{localStorage.removeItem(OLD_CODE_KEY)}catch(e){} // 예전 버전이 저장한 코드 원문은 지워요

// 코드 원문은 저장하지도, 보내지도 않아요. 일부러 느린 변환(PBKDF2 30만 번)으로 방 이름만 만들어요.
async function roomPath(code){
  const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(code.normalize("NFC")),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:new TextEncoder().encode("couple-date-menu/room/v2"),iterations:300000},key,256);
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
const enc=s=>encodeURIComponent(s).replace(/\./g,"%2E");
const dec=s=>{try{return decodeURIComponent(s)}catch(e){return s}};
let mirror={};
function setSync(state,txt){const el=$("sync");el.hidden=false;el.className="sync "+state;$("syncTxt").textContent=txt}
function remote(method,path,body){
  if(!DB_URL||!ROOT)return;
  fetch(ROOT+path+".json",{method,body:body===undefined?undefined:JSON.stringify(body)})
    .catch(()=>setSync("wait","저장 실패, 인터넷 확인해줘"));
}
function applyAt(obj,path,data,merge){
  const parts=path.split("/").filter(Boolean);
  if(!parts.length){if(merge){Object.assign(obj,data||{});return obj}return data||{}}
  let o=obj;for(let i=0;i<parts.length-1;i++){if(typeof o[parts[i]]!=="object"||!o[parts[i]])o[parts[i]]={};o=o[parts[i]]}
  const last=parts[parts.length-1];
  if(merge){if(typeof o[last]!=="object"||!o[last])o[last]={};Object.assign(o[last],data)}
  else if(data===null)delete o[last];else o[last]=data;
  return obj;
}
function fromMirror(){
  const m=mirror||{};S.sel={};
  Object.entries(m.sel||{}).forEach(([key,v])=>{if(v)S.sel[dec(key)]={me:!!v.me,her:!!v.her}});
  S.custom={play:Object.keys((m.custom||{}).play||{}).map(dec),food:Object.keys((m.custom||{}).food||{}).map(dec)};
  S.final={play:(m.final||{}).play||null,food:(m.final||{}).food||null};
  render();if(!$("sheet").hidden)renderSheet();
}
function getRoom(){try{const r=localStorage.getItem(ROOM_KEY)||"";return /^[0-9a-f]{64}$/.test(r)?r:""}catch(e){return ""}}
function getRole(){try{const r=localStorage.getItem(ROLE_KEY);return r==="me"||r==="her"?r:""}catch(e){return ""}}
function paintRole(){document.querySelectorAll("#rolePick button").forEach(b=>b.classList.toggle("on",b.dataset.r===pickRole))}
const roleName=r=>r==="me"?"나":"여자친구";
function askCode(){$("codeErr").textContent="";$("codeInput").value="";$("codeInput").placeholder=getRoom()?"비워두면 지금 코드 그대로 써":"8글자 이상, 둘만 아는 걸로";pickRole=getRole();paintRole();$("codeSheet").hidden=false;setTimeout(()=>$("codeInput").focus(),50)}
async function connect(){
  if(!DB_URL)return;
  const room=getRoom(),role=getRole();
  $("codeChange").hidden=false;
  if(!room||!role){setSync("wait","아직 연결 안 됨 (이 폰에만 저장)");askCode();return}
  if(es)es.close();
  S.who=role;document.querySelector(".who").hidden=true;render();
  ROOT=DB_URL.replace(/\/+$/,"")+"/date/rooms/"+room;
  mirror={};
  setSync("wait","연결 중…");
  es=new EventSource(ROOT+".json");
  const onMsg=merge=>e=>{try{const d=JSON.parse(e.data);
    if(merge)Object.entries(d.data||{}).forEach(([k2,v])=>{mirror=applyAt(mirror,d.path.replace(/\/$/,"")+"/"+k2,v,false)});
    else mirror=applyAt(mirror,d.path,d.data,false);
    fromMirror();setSync("on","같이 연결됨 · 이 폰은 "+roleName(getRole()))}catch(err){}};
  es.addEventListener("put",onMsg(false));
  es.addEventListener("patch",onMsg(true));
  es.onerror=()=>setSync("wait","연결이 끊겼어, 다시 연결하는 중…");
}
const R={
  toggle(t,n,who,val){remote(val?"PUT":"DELETE","/sel/"+enc(k(t,n))+"/"+who,val?true:undefined)},
  both(t,n){remote("PATCH","/sel/"+enc(k(t,n)),{me:true,her:true})},
  add(t,n){remote("PUT","/custom/"+t+"/"+enc(n),true)},
  del(t,n){remote("DELETE","/custom/"+t+"/"+enc(n));remote("DELETE","/sel/"+enc(k(t,n)))},
  final(t,n){remote(n?"PUT":"DELETE","/final/"+t,n||undefined)},
  reset(){remote("PATCH","",{sel:null,final:null})}
};
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}

function renderSheet(){
  ["play","food"].forEach(t=>{
    const m=matches(t);
    if(S.final[t]&&!m.includes(S.final[t]))S.final[t]=null;
    $("pk-"+t).innerHTML=m.length?m.map(n=>`<button data-t="${t}" data-n="${n.replace(/"/g,"&quot;")}" class="both${S.final[t]===n?" on":""}">${esc(n)}</button>`).join("")
      :`<span class="none">둘 다 고른 ${t==="play"?"놀거리":"메뉴"}가 아직 없어</span>`;
  });
  const f=S.final;
  $("ticket").innerHTML=`<span class="k">오늘 할 거</span><span class="v">${esc(f.play||"—")}</span><span class="k">오늘 먹을 거</span><span class="v">${esc(f.food||"—")}</span>`;
  save();
}

document.querySelector(".who").onclick=e=>{const b=e.target.closest("button");if(b){S.who=b.dataset.p;render()}};
document.querySelector(".tabs").onclick=e=>{const b=e.target.closest("button");if(b){S.tab=b.dataset.t;S.cat="전체";S.ftype="전체";S.fcui="전체";render()}};
$("chips").onclick=e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.c)S.cat=d.c;
  if(d.ft){S.ftype=d.ft;S.fcui="전체"}
  if(d.fc)S.fcui=d.fc;
  render()};
$("grid").onclick=e=>{
  const b=e.target.closest(".card");if(!b)return;const n=b.dataset.n;
  if(e.target.dataset.del){S.custom[S.tab]=S.custom[S.tab].filter(x=>x!==n);delete S.sel[k(S.tab,n)];R.del(S.tab,n);render();return}
  const s=S.sel[k(S.tab,n)]=S.sel[k(S.tab,n)]||{};s[S.who]=!s[S.who];R.toggle(S.tab,n,S.who,s[S.who]);render();
};
$("addForm").onsubmit=e=>{
  e.preventDefault();const v=$("addInput").value.trim();if(!v)return;
  if(!items(S.tab).some(i=>i.n===v)){S.custom[S.tab].push(v);R.add(S.tab,v)}
  const s=S.sel[k(S.tab,v)]=S.sel[k(S.tab,v)]||{};s[S.who]=true;R.toggle(S.tab,v,S.who,true);
  $("addInput").value="";S.cat="전체";S.ftype="전체";S.fcui="전체";render();
};
let armed=false;
$("reset").onclick=()=>{
  if(!armed){armed=true;$("reset").textContent="한 번 더 누르면 진짜 지워져!";setTimeout(()=>{armed=false;$("reset").textContent="선택 모두 지우기"},3000);return}
  armed=false;S.sel={};S.final={play:null,food:null};R.reset();$("reset").textContent="선택 모두 지우기";render();
};
$("decide").onclick=()=>{
  ["play","food"].forEach(t=>{const m=matches(t);if(!S.final[t]&&m.length===1){S.final[t]=m[0];R.final(t,m[0])}});
  renderSheet();$("sheet").hidden=false;
};
$("sheet").onclick=e=>{
  if(e.target.id==="sheet"||e.target.id==="close"){$("sheet").hidden=true;return}
  const b=e.target.closest(".pick button");if(!b)return;
  S.final[b.dataset.t]=S.final[b.dataset.t]===b.dataset.n?null:b.dataset.n;R.final(b.dataset.t,S.final[b.dataset.t]);renderSheet();
};

let rPick=null,rTimer=null;
function roll(){
  const pool=items(S.tab).filter(visible);
  if(!pool.length){$("rres").hidden=false;$("rq").textContent="고를 게 없어. 필터를 풀어봐!";$("rOk").hidden=true;return}
  $("rOk").hidden=true;$("rres").hidden=false;$("rres").classList.add("spin");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let n=reduce?1:12;clearInterval(rTimer);
  rTimer=setInterval(()=>{
    rPick=pool[Math.floor(Math.random()*pool.length)].n;
    $("rq").innerHTML=`오늘은 <b>${esc(rPick)}</b> 어때?`;
    if(--n<=0){clearInterval(rTimer);$("rres").classList.remove("spin");$("rOk").hidden=false}
  },70);
}
$("randBtn").onclick=roll;
$("rAgain").onclick=roll;
$("rOk").onclick=()=>{
  if(!rPick)return;
  S.sel[k(S.tab,rPick)]={me:true,her:true};S.final[S.tab]=rPick;R.both(S.tab,rPick);R.final(S.tab,rPick);
  $("rres").hidden=true;render();renderSheet();$("sheet").hidden=false;
};
const hideRand=()=>{clearInterval(rTimer);$("rres").hidden=true};
document.querySelector(".tabs").addEventListener("click",hideRand);
$("chips").addEventListener("click",hideRand);

// 처음 열었을 때 예시 선택 몇 개 (선택 기록이 없을 때만)
if(!DB_URL&&!Object.keys(S.sel).length){
  [["play","전시회",1,1],["play","방탈출",1,0],["play","한강 피크닉",0,1],["food","파스타",1,1],["food","곱창",1,0],["food","초밥",1,1],["food","디저트 카페",0,1]]
  .forEach(([t,n,m,h])=>S.sel[k(t,n)]={me:!!m,her:!!h});
}
$("codeForm").onsubmit=async e=>{
  e.preventDefault();
  const v=$("codeInput").value.trim();
  if(!v&&!getRoom()){$("codeErr").textContent="커플 코드를 넣어줘!";return}
  if(v&&[...v].length<8){$("codeErr").textContent="코드는 8글자 이상으로 정해줘!";return}
  if(!pickRole){$("codeErr").textContent="이 폰이 누구 건지 골라줘!";return}
  const btn=$("codeForm").querySelector(".cta");btn.disabled=true;$("codeErr").textContent="연결 준비 중…";
  try{
    const room=v?await roomPath(v):getRoom();
    $("codeInput").value="";
    localStorage.setItem(ROOM_KEY,room);localStorage.setItem(ROLE_KEY,pickRole);
  }catch(err){$("codeErr").textContent="이 브라우저에서는 연결할 수 없어. 다른 브라우저로 열어줘!";btn.disabled=false;return}
  btn.disabled=false;$("codeErr").textContent="";
  $("codeSheet").hidden=true;connect();
};
$("codeLater").onclick=()=>{$("codeSheet").hidden=true};
$("codeChange").onclick=askCode;
$("rolePick").onclick=e=>{const b=e.target.closest("button");if(b){pickRole=b.dataset.r;paintRole()}};
render();
connect();
</script>

</body>
</html>
